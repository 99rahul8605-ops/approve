<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1128">
  <title>Verify User</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0d1128;
      --paper:#f5f6fc;
      --card-line:#dde1f0;
      --ink:#161a33;
      --muted:#5e6584;
      --indigo:#4340f0;
      --indigo-deep:#2b27c4;
      --violet:#7a5cff;
      --ok:#0e9f6e;
      --danger:#d92d4a;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:22px 17px;
      overflow-x:hidden;
      font-family:"Bricolage Grotesque",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -10%,rgba(91,75,255,.35),transparent 45%),
        var(--bg);
    }

    .mesh{
      position:fixed;inset:0;pointer-events:none;opacity:.5;
      background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);
      background-size:22px 22px;
      mask-image:linear-gradient(to bottom,#000,transparent 80%);
      -webkit-mask-image:linear-gradient(to bottom,#000,transparent 80%);
    }

    .orb{position:fixed;border-radius:999px;filter:blur(80px);pointer-events:none;opacity:.3}
    .orb.a{width:270px;height:270px;background:#5b4bff;left:-110px;top:-90px;animation:driftA 8s ease-in-out infinite alternate}
    .orb.b{width:320px;height:320px;background:#2a6bff;right:-140px;bottom:-140px;animation:driftB 9s ease-in-out infinite alternate}

    .wrap{width:min(100%,455px);position:relative}
    .card{
      border-radius:24px;
      padding:34px 23px 22px;
      overflow:hidden;
      position:relative;
      background:var(--paper);
      box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5);
    }

    /* security-envelope style stripe on top of the pass */
    .card:before{
      content:"";position:absolute;left:0;right:0;top:0;height:10px;pointer-events:none;
      background:repeating-linear-gradient(135deg,var(--indigo) 0 6px,var(--indigo-deep) 6px 12px);
    }

    .pill{
      width:max-content;margin:0 auto 18px;display:flex;align-items:center;gap:8px;
      color:var(--indigo-deep);background:#e6e8fa;border:1px solid #d3d7f5;
      padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    }
    .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(14,159,110,.18);animation:pulse 1.7s ease-in-out infinite}

    .visual{width:108px;height:108px;margin:0 auto 19px;display:grid;place-items:center;position:relative}
    .ring{position:absolute;inset:0;border:1.5px solid var(--card-line);border-radius:50%}
    .ring:before{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(67,64,240,.4);border-radius:50%}
    .spin{position:absolute;inset:0;border-radius:50%;border-top:3px solid var(--indigo);border-right:3px solid transparent;animation:spin 2.7s linear infinite}
    .core{
      width:67px;height:67px;border-radius:22px;display:grid;place-items:center;overflow:hidden;
      font-size:30px;font-weight:800;color:#fff;
      background:linear-gradient(145deg,var(--indigo),var(--violet));
      box-shadow:0 14px 30px rgba(67,64,240,.32),inset 0 1px 0 rgba(255,255,255,.35);
    }
    .core img{width:100%;height:100%;object-fit:cover;display:none}
    .core.has-photo img{display:block}
    .core.has-photo .fallback-mark{display:none}

    h1{margin:0;text-align:center;font-size:29px;line-height:1.15;letter-spacing:-.025em;font-weight:750;color:var(--ink)}
    .sub{margin:10px auto 23px;max-width:320px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.55}

    .user{
      display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:16px;border-radius:16px;
      border:1px solid var(--card-line);background:#fff;
    }
    .avatar{
      width:43px;height:43px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
      color:#fff;font-weight:800;background:linear-gradient(135deg,var(--indigo),var(--violet));
    }
    .copy{min-width:0;flex:1}
    .small{font-size:12px;color:var(--muted);margin-bottom:3px}
    .name{font-size:15.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tick{
      width:29px;height:29px;display:grid;place-items:center;border-radius:50%;
      color:var(--muted);border:1px solid var(--card-line);background:#f0f2fa;font-weight:700
    }
    .tick.ok{color:var(--ok);border-color:rgba(14,159,110,.35);background:rgba(14,159,110,.12)}

    .progress{padding:2px 2px 0;margin-bottom:16px}
    .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin-bottom:9px;font-weight:500}
    .ph strong{color:var(--ink);font-weight:700}
    .track{height:8px;border-radius:999px;overflow:hidden;background:#e1e4f3}
    .bar{
      width:0;height:100%;border-radius:inherit;
      background:linear-gradient(90deg,var(--indigo),var(--violet));
      transition:width .32s ease;
    }

    .status{
      min-height:48px;display:flex;gap:10px;align-items:center;padding:12px 13px;margin-bottom:16px;
      border-radius:12px;border:1px solid #dfe3f3;border-left:4px solid var(--indigo);background:#eceffa;
      color:#3b4263;font-size:13.5px;line-height:1.42;
    }
    .status.success{color:#0b5a40;border-color:rgba(14,159,110,.25);border-left-color:var(--ok);background:#e2f6ee}
    .status.error{color:#8e1b31;border-color:rgba(217,45,74,.25);border-left-color:var(--danger);background:#fde9ed}
    .si{width:24px;height:24px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;background:rgba(22,26,51,.07)}

    .btn{
      width:100%;min-height:54px;border:0;border-radius:14px;position:relative;overflow:hidden;
      cursor:pointer;color:#fff;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.005em;
      background:linear-gradient(180deg,#5754f7,var(--indigo) 55%,var(--indigo-deep));
      box-shadow:0 12px 26px rgba(67,64,240,.36),inset 0 1px 0 rgba(255,255,255,.28);
      transition:transform .17s ease,opacity .17s ease,filter .17s ease;
    }
    .btn:hover:not(:disabled){filter:brightness(1.06)}
    .btn:active{transform:scale(.985)}
    .btn:focus-visible{outline:3px solid rgba(67,64,240,.4);outline-offset:3px}
    .btn:disabled{cursor:not-allowed;opacity:.7;filter:saturate(.85)}

    .foot{
      margin-top:14px;text-align:center;color:#666d8c;font-size:11px;line-height:1.5;
    }

    .loader{
      display:inline-block;width:14px;height:14px;margin-right:8px;border-radius:50%;
      border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
      vertical-align:-2px;animation:spin .7s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes driftA{to{transform:translate(20px,24px)}}
    @keyframes driftB{to{transform:translate(-18px,-22px)}}

    @media(max-width:420px){
      .card{padding:31px 18px 20px;border-radius:22px}
      h1{font-size:26px}
      .visual{width:98px;height:98px}
      .core{width:60px;height:60px;border-radius:20px;font-size:27px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}
    }
  </style>
</head>

<body>
  <div class="mesh"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="wrap">
    <section class="card">
      <div class="pill"><span class="pulse"></span><span>Secure verification</span></div>

      <div class="visual">
        <div class="ring"></div>
        <div class="spin"></div>
        <div class="core"><img id="groupDp" alt="Group photo"><span class="fallback-mark">✓</span></div>
      </div>

      <h1>Verify User</h1>
      <p class="sub">Tap below to complete verification and continue.</p>

      <div class="user">
        <div class="avatar" id="avatar">U</div>
        <div class="copy">
          <div class="small">Telegram account</div>
          <div class="name" id="tgUser">Detecting user...</div>
        </div>
        <div class="tick" id="userTick">•</div>
      </div>

      <div class="progress">
        <div class="ph">
          <strong id="progressLabel">Ready</strong>
          <span id="progressPercent">0%</span>
        </div>
        <div class="track"><div class="bar" id="progressBar"></div></div>
      </div>

      <div class="status" id="statusBox">
        <div class="si" id="statusIcon">⏳</div>
        <div id="statusText">Ready to verify.</div>
      </div>

      <button class="btn" id="verifyBtn" type="button">Verify Now</button>

      <div class="foot">
        Security verification may process account, device/browser and network signals for abuse prevention.
      </div>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    const user = tg?.initDataUnsafe?.user || null;

    const el = id => document.getElementById(id);
    const tgUser = el("tgUser");
    const pageTitle = document.querySelector("h1");
    const pageSub = document.querySelector(".sub");
    const coreIcon = document.querySelector(".core");
    const groupDp = el("groupDp");
    const avatar = el("avatar");
    const userTick = el("userTick");
    const verifyBtn = el("verifyBtn");
    const statusBox = el("statusBox");
    const statusText = el("statusText");
    const statusIcon = el("statusIcon");
    const progressBar = el("progressBar");
    const progressLabel = el("progressLabel");
    const progressPercent = el("progressPercent");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const queryParams=new URLSearchParams(window.location.search);
    const pageGroupId=queryParams.get("group_id");
    if(pageGroupId && groupDp){
      groupDp.onload=()=>coreIcon.classList.add("has-photo");
      groupDp.onerror=()=>{coreIcon.classList.remove("has-photo");groupDp.removeAttribute("src");};
      groupDp.src=`/group-photo?group_id=${encodeURIComponent(pageGroupId)}`;
    }

    function setProgress(n,label){
      n=Math.max(0,Math.min(100,Number(n)||0));
      progressBar.style.width=n+"%";
      progressPercent.textContent=n+"%";
      progressLabel.textContent=label||"";
    }

    function setStatus(text,type=""){
      statusText.textContent=text;
      statusBox.className="status"+(type?" "+type:"");
      statusIcon.textContent=type==="success"?"✓":type==="error"?"!":"⏳";
    }

    function showBannedScreen(groupName){
      const safeName=groupName||"this group";
      pageTitle.textContent="Verification Blocked";
      pageSub.textContent=`We found suspicious activity while verifying access to ${safeName}.`;
      coreIcon.classList.remove("has-photo");
      if(groupDp) groupDp.removeAttribute("src");
      const mark=coreIcon.querySelector(".fallback-mark");
      if(mark) mark.textContent="🚫";
      setProgress(100,"Blocked");
      setStatus("We found suspicious activity during verification. Please contact the group administrator for assistance.","error");
      verifyBtn.disabled=true;
      verifyBtn.textContent="Verification Blocked";
      document.querySelector(".foot").textContent="Please contact the group administrator for further assistance.";
      if(tg?.HapticFeedback){
        tg.HapticFeedback.notificationOccurred("error");
      }
    }

    if(user){
      const display=[user.first_name||"",user.last_name||""].filter(Boolean).join(" ").trim();
      const shown=display||(user.username?"@"+user.username:String(user.id));
      tgUser.textContent=shown;
      avatar.textContent=(display||user.username||"U").trim().charAt(0).toUpperCase();
      userTick.textContent="✓";
      userTick.classList.add("ok");
    } else {
      tgUser.textContent="Telegram user unavailable";
      userTick.textContent="!";
      setStatus("Open verification from Telegram.","error");
    }

    async function sha256(text){
      const bytes=new TextEncoder().encode(text);
      const hash=await crypto.subtle.digest("SHA-256",bytes);
      return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function canvasSignal(){
      try{
        const c=document.createElement("canvas");
        c.width=280;c.height=72;
        const x=c.getContext("2d");
        x.textBaseline="top";
        x.font="16px Arial";
        x.fillStyle="#f60";x.fillRect(0,0,280,72);
        x.fillStyle="#069";x.fillText("Verify TG • 58291 • Ω",8,8);
        x.fillStyle="rgba(102,204,0,.7)";x.fillText("Secure ✓",16,32);
        return c.toDataURL();
      }catch(e){return "canvas-unavailable"}
    }

    async function fingerprint(){
      const raw=[
        navigator.userAgent||"",
        navigator.language||"",
        navigator.languages?.join(",")||"",
        navigator.platform||"",
        screen.width,screen.height,screen.colorDepth,
        window.devicePixelRatio||1,
        Intl.DateTimeFormat().resolvedOptions().timeZone||"",
        navigator.hardwareConcurrency||"",
        navigator.deviceMemory||"",
        navigator.maxTouchPoints||"",
        canvasSignal()
      ].join("|");
      return sha256(raw);
    }

    const wait=ms=>new Promise(r=>setTimeout(r,ms));

    async function verify(){
      if(!tg||!user){
        setStatus("Verification must be opened inside Telegram.","error");
        return;
      }

      verifyBtn.disabled=true;
      verifyBtn.innerHTML='<span class="loader"></span>Verifying';

      try{
        setProgress(18,"Preparing");
        setStatus("Starting verification...");
        await wait(180);

        setProgress(47,"Checking");
        setStatus("Verifying user...");
        const fp=await fingerprint();
        await wait(200);

        setProgress(72,"Confirming");
        setStatus("Confirming verification...");

        const params=new URLSearchParams(window.location.search);
        const groupId=params.get("group_id");

        const payload={
          initData:tg.initData,
          telegram_user_id:user.id,
          group_id:groupId,
          fingerprint:fp,
          timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,
          language:navigator.language||null,
          platform:navigator.platform||null,
          user_agent:navigator.userAgent||null,
          screen:`${screen.width}x${screen.height}`,
          hardware_concurrency:navigator.hardwareConcurrency||null,
          max_touch_points:navigator.maxTouchPoints||null,
          timestamp:new Date().toISOString()
        };

        const res=await fetch("/api/verify",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });

        let data={};
        try{data=await res.json()}catch(e){}

        if(data.status==="restricted"){
          showBannedScreen(data.group_name);
          return;
        }

        if(data.status==="manual_review"){
          setProgress(100,"Under review");
          setStatus(data.message||"Verification submitted for administrator review. Please wait for approval.","success");
          verifyBtn.disabled=true;
          verifyBtn.textContent="Pending Admin Review";
          if(tg?.HapticFeedback){
            tg.HapticFeedback.notificationOccurred("success");
          }
          return;
        }

        if(!res.ok||!data.ok){
          throw new Error(data.message||"Verification could not be approved.");
        }

        setProgress(100,"Complete");
        setStatus(data.message||"Verification completed successfully.","success");
        verifyBtn.textContent="Verified ✓";

        if(tg?.HapticFeedback){
          tg.HapticFeedback.notificationOccurred("success");
        }
      }catch(err){
        setProgress(0,"Ready");
        setStatus(err?.message||"Verification failed. Please try again.","error");
        verifyBtn.disabled=false;
        verifyBtn.textContent="Try Again";

        if(tg?.HapticFeedback){
          tg.HapticFeedback.notificationOccurred("error");
        }
      }
    }

    verifyBtn.addEventListener("click",verify);
  </script>
</body>
</html>
